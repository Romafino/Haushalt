<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Notfall – Haushalt</title>
<style>
  :root { --hg: #f6f5f2; --fl: #fff; --tx: #1d1f22; --le: #5f6368; --li: #e3e1dc; --ak: #2f5d50; --fe: #b3261e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --hg: #16171a; --fl: #1f2125; --tx: #ecebe8; --le: #a3a6ab; --li: #34363b; --ak: #7fb8a4; --fe: #f2b8b5; } }
  * { box-sizing: border-box; margin: 0; }
  body { font: 17px/1.45 -apple-system, system-ui, sans-serif; background: var(--hg); color: var(--tx); padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  main { max-width: 34rem; margin: 0 auto; display: grid; gap: 1rem; }
  .karte { background: var(--fl); border: 1px solid var(--li); border-radius: 14px; padding: 1rem; display: grid; gap: .6rem; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; }
  ol { padding-left: 1.3rem; display: grid; gap: .4rem; }
  a.tel { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem .8rem; border: 1px solid var(--li); border-radius: 10px; color: var(--tx); text-decoration: none; }
  a.tel strong { color: var(--ak); white-space: nowrap; }
  .leise { color: var(--le); font-size: .92rem; }
  .warn { color: var(--fe); }
</style>
</head>
<body>
<main>
  <h1>Notfall</h1>
  <p class="leise warn" id="offline" hidden>Keine Verbindung – angezeigt wird der zuletzt gespeicherte Stand.</p>
  <section class="karte"><h2>Sofortmaßnahmen</h2><ol id="sofort"></ol></section>
  <section class="karte"><h2>Hotlines</h2><div id="hotlines" style="display:grid;gap:.5rem"></div></section>
  <p class="leise" id="stand"></p>
  <p class="leise"><a href="/schaden">Zum Schadenfall in der App</a></p>
</main>
<script>
  (function () {
    var STD = ['Schaden begrenzen: Wasser abstellen, Strom sichern, Gefahrenstelle absperren.', 'Fotos und Videos machen, bevor etwas verändert oder weggeworfen wird.', 'Unverzüglich beim Versicherer melden. Bei Einbruch, Diebstahl oder Unfall auch bei der Polizei.', 'Beschädigte Sachen und Belege aufbewahren, Reparaturen erst nach Rücksprache.'];
    var d = {}; try { d = JSON.parse(localStorage.getItem('notfall') || '{}'); } catch (e) {}
    if (!navigator.onLine) document.getElementById('offline').hidden = false;
    var ol = document.getElementById('sofort');
    (Array.isArray(d.sofort) && d.sofort.length ? d.sofort : STD).forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
    var h = document.getElementById('hotlines');
    if (!Array.isArray(d.hotlines) || !d.hotlines.length) { var p = document.createElement('p'); p.className = 'leise'; p.textContent = 'Noch keine Hotlines gespeichert. Einmal mit Verbindung die Seite „Schadenfall“ in der App öffnen.'; h.appendChild(p); }
    else d.hotlines.forEach(function (x) {
      var a = document.createElement('a'); a.className = 'tel'; a.href = 'tel:' + String(x.nummer).replace(/[^\d+]/g, '');
      var s = document.createElement('span'); s.textContent = x.vertrag + (x.firma ? ' · ' + x.firma : '');
      var n = document.createElement('strong'); n.textContent = x.nummer; a.appendChild(s); a.appendChild(n); h.appendChild(a);
    });
    if (d.stand) document.getElementById('stand').textContent = 'Stand: ' + d.stand.split('-').reverse().join('.');
  })();
</script>
</body>
</html>
